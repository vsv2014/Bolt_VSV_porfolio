  <marker id="downArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#b6f746" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="leftArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#b6f746" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
