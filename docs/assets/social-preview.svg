  <linearGradient id="nodeBorder" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#31d7ff"/><stop offset="1" stop-color="#8175ff"/></linearGradient>
  <radialGradient id="glowA"><stop stop-color="#b8fc37" stop-opacity=".15"/><stop offset="1" stop-color="#b8fc37" stop-opacity="0"/></radialGradient>
