<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Santhosh Vishal — Engineering Portfolio</title>
<desc id="desc">Frontend, full-stack, and AI platforms portfolio. A clean four-step engineering workflow flows from Input to Retrieve to Tool to Review.</desc>
