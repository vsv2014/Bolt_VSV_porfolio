name: One-time lockfile refresh (temporary)
on:
  push:
    branches: ['chore/portfolio-modern-deps-20261112']
    paths:
      - package.json
      - .github/workflows/regenerate-lock-once.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve reviewed package versions and refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Save only the regenerated package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(lockfile): resolve verified modern dependencies"
            git push origin HEAD:chore/portfolio-modern-deps-20261112
          fi
