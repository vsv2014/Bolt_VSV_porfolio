name: Generate portfolio social-preview PNG
on:
  push:
    branches: [main]
    paths:
      - public/assets/social-preview.svg
      - scripts/render-social-preview.mjs
      - .github/workflows/generate-social-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Render verified social image
        run: node scripts/render-social-preview.mjs
      - name: Persist generated PNG in repository
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/social-preview.png
          if git diff --cached --quiet; then
            echo "Preview image unchanged"
          else
            git commit -m "chore: refresh social-preview PNG from vector source [skip ci]"
            # Pages publishes generated /docs files to main independently.
            # Replay our image-only commit over the latest remote head to avoid
            # failing when those Pages commits land during rendering.
            for attempt in 1 2 3 4 5; do
              git fetch origin "${TARGET_BRANCH}"
              git rebase "origin/${TARGET_BRANCH}"
              if git push origin "HEAD:${TARGET_BRANCH}"; then
                echo "Social preview published"
                exit 0
              fi
              echo "Remote advanced during push; retrying: ${attempt}/5"
              sleep 3
            done
            echo "Could not publish social preview after five attempts"
            exit 1
          fi
