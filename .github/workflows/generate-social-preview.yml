name: Validate portfolio social-preview PNG
on:
  push:
    branches: [main]
    paths:
      - public/assets/social-preview.svg
      - public/assets/social-preview.png
      - scripts/render-social-preview.mjs
      - .github/workflows/generate-social-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Re-render social image and ensure committed PNG matches source SVG
        run: |
          node scripts/render-social-preview.mjs
          git diff --exit-code -- public/assets/social-preview.png
