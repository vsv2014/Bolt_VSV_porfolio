name: Portfolio quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Pin to the WebKit-supported runner image for Playwright 1.56.x.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Enforce entry bundle size budgets
        run: node scripts/check-bundle-budgets.mjs
      - name: Inspect GitHub Pages publishing mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/pages --jq '{build_type: .build_type, source: .source}' || true
      - name: Chromium browser smoke
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1 axe-core@4.14.0
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          node tests/browser-smoke.mjs
          node tests/mobile-first-paint.mjs
          node tests/accessibility-smoke.mjs
      - name: Install WebKit browser and dependencies for iPhone-style checks
        run: npx --yes playwright@1.56.1 install --with-deps webkit
      - name: WebKit mobile first-screen smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview-webkit.log 2>&1 &
          PLAYWRIGHT_BROWSER=webkit node tests/mobile-first-paint.mjs
      - name: Upload craft screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-craft-screenshots
          path: |
            /tmp/portfolio-craft-*.png
            /tmp/portfolio-stories-*.png
            /tmp/portfolio-mobile-*.png
          if-no-files-found: ignore
