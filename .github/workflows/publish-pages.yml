name: Publish portfolio to GitHub Pages (artifact only)
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Configure existing Pages source for artifact deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type')"
          if [ "$mode" != "workflow" ]; then
            # Migrate from main:/docs. No generated files or commits are pushed to main.
            gh api --method PUT "repos/${{ github.repository }}/pages" -f build_type=workflow
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
