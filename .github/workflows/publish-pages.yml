name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Detect the existing Pages source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/"${{ github.repository }}"/pages --jq '.build_type' | xargs -I{} echo "type={}" >> "$GITHUB_OUTPUT"
          gh api repos/"${{ github.repository }}"/pages --jq '.source.branch // ""' | xargs -I{} echo "branch={}" >> "$GITHUB_OUTPUT"
          gh api repos/"${{ github.repository }}"/pages --jq '.source.path // ""' | xargs -I{} echo "path={}" >> "$GITHUB_OUTPUT"
      - name: Update compiled /docs for the existing branch-based Pages site
        if: steps.pages.outputs.type == 'legacy' && steps.pages.outputs.branch == 'main' && steps.pages.outputs.path == '/docs'
        run: |
          mkdir -p docs
          rsync --archive --delete dist/ docs/
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if ! git diff --cached --quiet; then
            git commit -m "build(pages): publish verified portfolio"
            git push origin HEAD:main
          fi
      - name: Explicitly request Pages build after GITHUB_TOKEN docs update
        if: steps.pages.outputs.type == 'legacy' && steps.pages.outputs.branch == 'main' && steps.pages.outputs.path == '/docs'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/"${{ github.repository }}"/pages/builds
      - name: Refuse unsupported branch source without changing its publishing configuration
        if: steps.pages.outputs.type == 'legacy' && (steps.pages.outputs.branch != 'main' || steps.pages.outputs.path != '/docs')
        run: |
          echo "::error::Existing Pages source is not main:/docs. Keeping it unchanged. Configure a matching publishing workflow first."
          exit 1
      - name: Configure GitHub Actions Pages publishing
        if: steps.pages.outputs.type == 'workflow'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: steps.pages.outputs.type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy GitHub Pages artifact
        if: steps.pages.outputs.type == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4
